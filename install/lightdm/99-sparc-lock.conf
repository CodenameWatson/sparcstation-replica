[Seat:*]
autologin-user=pi
autologin-user-timeout=0

# Session must exist in /usr/share/xsessions on the target image.
# Common defaults on Raspberry Pi OS Lite/Desktop images: lightdm-xsession, openbox
user-session=lightdm-xsession
autologin-session=lightdm-xsession

greeter-session=lightdm-gtk-greeter
xserver-command=X -core -nolisten tcp
