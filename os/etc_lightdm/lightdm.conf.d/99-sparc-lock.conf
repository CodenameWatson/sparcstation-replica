[Seat:*]
autologin-user=pi
autologin-user-timeout=0
user-session=sparc-lock
autologin-session=sparc-lock

# Use an X11 greeter so the seat runs Xorg (best for openbox kiosk)
greeter-session=lightdm-gtk-greeter

# Force Xorg (avoid Wayland/labwc seat which breaks openbox)
xserver-command=X -core -nolisten tcp
